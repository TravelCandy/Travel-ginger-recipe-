<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Travel Candy | Video Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f7;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 40px 20px;
    }

    .success {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .message {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .video-box {
      background: #fff;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }

    .note {
      margin-top: 25px;
      font-size: 15px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="success">✅</div>

    <h1>Payment Successful!</h1>

    <p class="message">
      Thank you for your purchase.<br>
      You can watch your complete video guide below.
    </p>

    <div class="video-box">

      <!-- Video will be added here -->

      <p style="padding: 40px 10px; color: #777;">
        Your video will appear here.
      </p>

    </div>

    <p class="note">
      Please watch the complete video for the full guide.
    </p>

  </div>

</body>
</html>
